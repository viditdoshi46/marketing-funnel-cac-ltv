# Pin a light theme so the BI control panel renders as designed for every viewer
# (its white scorecard panels + dark text assume a light canvas). Deterministic,
# not dependent on the visitor's browser/system dark mode.
[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fa"
textColor = "#0f172a"
